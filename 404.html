<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found &#183; IcZScripts &#183; SuiteTools</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%20role=%22img%22%20aria-label=%22IcZ%20SuiteTools%22%3E%20%3Ctitle%3EIcZ%20SuiteTools%3C/title%3E%20%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%2300BCD4%22/%3E%20%3Cg%20fill=%22%230B1013%22%3E%20%3Crect%20x=%227%22%20y=%2218%22%20width=%226%22%20height=%2228%22/%3E%20%3Cpath%20d=%22M36%2018%20H57%20V24%20L46%2040%20H57%20V46%20H36%20V40%20L47%2024%20H36%20Z%22/%3E%20%3C/g%3E%20%3Cpath%20d=%22M27.7%2030.7%20A6.5%206.5%200%201%200%2027.7%2041.3%22%20fill=%22none%22%20stroke=%22%230B1013%22%20stroke-width=%225.5%22%20stroke-linecap=%22round%22/%3E%20%3C/svg%3E" type="image/svg+xml">
<style>
  /* Palette lifted verbatim from index.html so a 404 never looks like a
     different site. Dark is the default; light follows the OS preference. */
  :root{
    --bg:#0B1013; --panel:#152026; --line:#283B45;
    --text:#ECF4F7; --text-2:#8FA6B2; --accent:#00BCD4;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#ECEFF1; --panel:#FFFFFF; --line:#CFD8DC;
      --text:#263238; --text-2:#546E7A; --accent:#0097A7;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  }
  .card{
    max-width:560px; width:100%; padding:38px 34px; border-radius:18px;
    background:var(--panel); border:1px solid var(--line); text-align:center;
  }
  .code{
    font-size:11px; font-weight:800; letter-spacing:2.4px; text-transform:uppercase;
    color:var(--accent); margin:0 0 14px;
  }
  h1{margin:0 0 12px; font-size:26px; font-weight:700; letter-spacing:-.2px}
  p{margin:0 0 24px; font-size:14.5px; line-height:1.65; color:var(--text-2)}
  a.home{
    display:inline-block; padding:11px 22px; border-radius:10px; text-decoration:none;
    font-size:13.5px; font-weight:700; color:var(--bg); background:var(--accent);
  }
  a.home:hover{filter:brightness(1.08)}
  .hint{margin:22px 0 0; font-size:12px; color:var(--text-2); opacity:.8}
  .hint code{
    font-family:'Cascadia Code','SF Mono',Consolas,monospace; font-size:.92em;
    padding:2px 6px; border-radius:5px; border:1px solid var(--line);
  }
</style>
</head>
<body>
  <div class="card">
    <p class="code">Error 404</p>
    <h1>That page isn&rsquo;t here</h1>
    <p>
      This site is a single page &mdash; every tool lives in a section of it, and the
      interface previews live under <code>/mockups/</code>. A link that landed you here
      is either out of date or was never a page.
    </p>
    <a class="home" href="/">Back to the suite</a>
    <p class="hint">Looking for a specific tool? Open <code>/</code> and use the sidebar.</p>
  </div>
</body>
</html>
